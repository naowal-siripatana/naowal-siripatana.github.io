<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Naowal's Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --night:#1C1430; --night-2:#2A1F45; --night-3:#3A2C5E;
  --ink:#2A1B3D; --parch:#FFF4E6; --parch-2:#F6E2C8;
  --coral:#FF6B4A; --coral-deep:#E2482A; --honey:#FFC15E; --blush:#FF9EC4; --mint:#7FE0C2; --lav:#C9BCEF;
  --muted-ink:#6B5A80;
  --px:"Mochiy Pop One", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #3B2A63 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 110%, #3A1F3F 0%, transparent 60%),
    var(--night);
  color:var(--parch); font-family:var(--body); font-size:16px; line-height:1.55;
  padding-inline:16px; padding-block:20px 40px; box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* HUD */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.logo{font-family:var(--px);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--honey);display:flex;align-items:center;gap:8px}
.logo .heart{color:var(--blush)}
.lvl{display:flex;align-items:center;gap:10px;font-family:var(--px);font-size:15px;color:var(--lav);flex:1;min-width:180px;max-width:320px}
.lvl b{color:var(--parch);font-weight:600;white-space:nowrap}
.xpbar{flex:1;height:12px;background:var(--night-2);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--night-3);position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--mint) 0 6px,#9FEBD3 6px 8px);width:0;transition:width .6s ease}
.hud-btns{display:flex;gap:8px}
.hbtn{font-family:var(--px);font-size:15px;color:var(--parch);background:var(--night-2);border:2px solid var(--night-3);padding:6px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.hbtn:hover{border-color:var(--honey);color:var(--honey)}
.hbtn:focus-visible,.choice:focus-visible,.tile:focus-visible,.big:focus-visible,.xbtn:focus-visible{outline:3px solid var(--honey);outline-offset:2px}

/* Stage */
.stage{position:relative;height:clamp(230px,42vw,350px);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--night-3),6px 6px 0 3px var(--ink);overflow:hidden;background:var(--night-2)}
.stage::before{content:"";position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 34% 8%,#fff9 50%,transparent 51%),
  radial-gradient(2px 2px at 58% 22%,#ffe9 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 76% 12%,#fff8 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 90% 30%,#fff7 50%,transparent 51%),
  radial-gradient(2px 2px at 22% 36%,#fff6 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 46% 40%,#fff5 50%,transparent 51%);
  pointer-events:none}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;background:var(--ground,#2d4a3e);
  box-shadow:0 -6px 0 var(--ground-top,#3f6a55);pointer-events:none}
.bg-home{background:linear-gradient(#2B2150,#5B3A6E 70%,#8A4B6A);--ground:#3E2A4A;--ground-top:#5A3D63}
.bg-academy{background:linear-gradient(#17304A,#2C5A6E 70%,#4B8A86);--ground:#2E4A3A;--ground-top:#46704F}
.bg-forge{background:linear-gradient(#2A1420,#6E2A2A 65%,#C4552E);--ground:#3A2220;--ground-top:#5B3027}
.bg-tower{background:linear-gradient(#1E1840,#4A3A86 60%,#9B6FB8);--ground:#2E2550;--ground-top:#43387A}
.bg-guild{background:linear-gradient(#2B1E3A,#7A4E3A 65%,#E0A04E);--ground:#4A3322;--ground-top:#6E4A2C}
.bg-citadel{background:linear-gradient(#0F1A3A,#1F3A6E 65%,#3B6BA0);--ground:#1C2A48;--ground-top:#2E4570}
.bg-gate{background:linear-gradient(#120C22,#3A1840 60%,#7A2A4A);--ground:#24142E;--ground-top:#3A1F48}
.deco{position:absolute;pointer-events:none;z-index:1}
.moon{top:10%;right:9%;width:44px;height:44px;background:var(--parch);box-shadow:0 0 0 4px #FFF4E633,0 0 40px #FFC15E66;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.spr{position:absolute;bottom:14%;z-index:2;width:clamp(96px,17vw,150px);height:auto;transition:filter .3s, transform .3s}
.spr.left{left:8%} .spr.right{right:8%;transform:scaleX(-1)}
.spr.center{left:50%;transform:translateX(-50%);width:clamp(120px,22vw,190px)}
.spr.dim{filter:brightness(.55) saturate(.7)}
.spr.talk{animation:bob 1.2s ease-in-out infinite}
.spr.right.talk{animation:bobr 1.2s ease-in-out infinite}
@keyframes bob{50%{translate:0 -6px}}
@keyframes bobr{50%{translate:0 -6px}}
.spr.hit{animation:hit .5s ease}
@keyframes hit{0%,100%{translate:0}25%{translate:-10px 0;filter:brightness(2)}75%{translate:10px 0;filter:brightness(2)}}
.place{position:absolute;top:12px;left:12px;z-index:3;font-family:var(--px);font-size:14px;background:#1C1430cc;color:var(--honey);padding:4px 10px;border:2px solid var(--ink);letter-spacing:.05em}
.bosshp{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:6px;align-items:center;font-family:var(--px);font-size:14px;background:#1C1430cc;padding:4px 10px;border:2px solid var(--ink)}
.bosshp span{width:18px;height:12px;background:var(--coral);border:2px solid var(--ink)}
.bosshp span.off{background:var(--night-3)}

/* Title */
.title-card{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:0 7%;gap:6px;max-width:62%}
.title-card h1{font-family:var(--px);font-weight:700;font-size:clamp(34px,7vw,64px);line-height:.95;margin:0;color:var(--parch);text-shadow:4px 4px 0 var(--ink),0 0 30px #FF6B4A55;text-wrap:balance}
.title-card h1 em{font-style:normal;color:var(--honey)}
.title-card p{margin:0;font-size:clamp(14px,2vw,17px);color:#F1E4FF;max-width:34ch;text-shadow:2px 2px 0 var(--ink)}
.title-card .press{font-family:var(--px);color:var(--blush);font-size:14px;letter-spacing:.12em;margin-top:6px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* Dialog */
.box{background:var(--parch);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--parch-2),6px 6px 0 3px var(--ink);padding:18px 20px 16px;position:relative;margin-top:10px}
.name{position:absolute;top:-16px;left:16px;font-family:var(--px);font-weight:600;font-size:15px;background:var(--coral);color:var(--parch);padding:3px 12px;border:3px solid var(--ink);letter-spacing:.04em}
.name.npc{background:var(--night-3)}
.text{font-size:clamp(16px,2.1vw,18px);line-height:1.6;min-height:3.2em;max-width:68ch;margin:6px 0 0;cursor:pointer}
.text .hl{color:var(--coral-deep);font-weight:800}
.caret{display:inline-block;margin-left:4px;color:var(--coral);animation:blink .8s ease-in-out infinite}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choice{font-family:var(--body);font-weight:700;font-size:15.5px;text-align:left;color:var(--ink);background:#fff;border:3px solid var(--ink);padding:10px 14px 10px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:flex;gap:10px;align-items:flex-start;text-decoration:none;transition:transform .08s}
.choice .k{font-family:var(--px);font-size:13px;background:var(--parch-2);border:2px solid var(--ink);min-width:24px;height:24px;display:grid;place-items:center;flex:none}
.choice:hover{background:var(--honey)}
.choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.choice.primary{background:var(--coral);color:var(--parch)}
.choice.primary:hover{background:var(--coral-deep)}
.choice.primary .k{background:var(--parch);color:var(--ink)}
.choice small{display:block;font-weight:600;opacity:.75;font-size:13px}
@media (max-width:560px){.choices{grid-template-columns:1fr}.title-card{max-width:100%;padding-right:40%}.spr.right{right:3%}.spr.left{left:3%}}

/* Map */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
@media (max-width:640px){.map{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;text-align:left;font-family:var(--body);color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 12px 12px;cursor:pointer;display:grid;grid-template-columns:48px 1fr;gap:4px 10px;align-items:center}
.tile svg{width:48px;height:48px;grid-row:span 2;background:var(--tile-bg,#eee);border:2px solid var(--ink)}
.tile .tn{font-family:var(--px);font-weight:600;font-size:16px;line-height:1.1}
.tile .ty{font-size:13px;color:var(--muted-ink);font-weight:700;font-variant-numeric:tabular-nums}
.tile .st{grid-column:1/-1;font-family:var(--px);font-size:12.5px;letter-spacing:.05em;margin-top:6px;padding:2px 8px;border:2px solid var(--ink);justify-self:start;background:var(--parch-2)}
.tile.done .st{background:var(--mint)}
.tile:hover{background:var(--parch)}
.tile.locked{cursor:not-allowed;background:#E9E0EE;color:#7A6D8A}
.tile.locked svg{filter:grayscale(1) brightness(.6)}
.tile.gate:not(.locked) .st{background:var(--coral);color:var(--parch)}

/* Overlay */
.ov{position:fixed;inset:0;z-index:50;background:#120C22d9;display:grid;place-items:center;padding:16px;overflow:auto}
.card{background:var(--parch);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--parch-2),8px 8px 0 3px var(--ink);width:min(560px,100%);padding:22px;position:relative;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:.4}}
.card h2{font-family:var(--px);font-weight:700;margin:0;font-size:26px;line-height:1.1}
.eyebrow{font-family:var(--px);font-size:13px;letter-spacing:.14em;color:var(--coral-deep);text-transform:uppercase}
.xbtn{position:absolute;top:10px;right:10px;font-family:var(--px);font-size:16px;background:var(--parch-2);border:2px solid var(--ink);width:32px;height:32px;cursor:pointer;color:var(--ink)}
.get{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin:14px 0}
.get svg{width:72px;height:72px;background:var(--honey);border:3px solid var(--ink)}
.get p{margin:4px 0 0}
.bumps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.chip{font-family:var(--px);font-size:13px;padding:2px 9px;border:2px solid var(--ink);background:#fff}
.chip.mint{background:var(--mint)} .chip.pink{background:var(--blush)} .chip.honey{background:var(--honey)}
.big{font-family:var(--px);font-weight:600;font-size:17px;background:var(--coral);color:var(--parch);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:9px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.big.alt{background:#fff;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* Character sheet */
.sheet-head{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
.sheet-head svg{width:88px;height:88px;background:linear-gradient(#5B3A6E,#8A4B6A);border:3px solid var(--ink)}
.sheet-head p{margin:2px 0;font-size:14.5px}
.sec{font-family:var(--px);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-ink);margin:18px 0 8px}
.stats{display:grid;gap:7px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14.5px;font-weight:700}
.stat small{display:block;font-weight:600;color:var(--muted-ink);font-size:12.5px}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:16px;border:2px solid var(--ink);background:#fff}
.pips i.on{background:var(--coral)}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{border:2px solid var(--ink);background:#fff;aspect-ratio:1;max-width:100%;display:grid;place-items:center;position:relative}
.slot svg{width:70%;height:70%}
.slot.empty{background:repeating-linear-gradient(45deg,#EFE4F2 0 6px,#E4D6EA 6px 12px);font-family:var(--px);color:#8C7D9C}
.inv-names{font-size:13px;color:var(--muted-ink);margin:8px 0 0}
.traits{display:flex;flex-wrap:wrap;gap:6px}

.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;font-family:var(--px);font-size:18px;background:var(--honey);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 18px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.foot{font-size:13px;color:var(--lav);text-align:center;opacity:.8}
.foot a{color:var(--honey)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Chibi theme ---------- */
.logo,.title-card h1,.card h2,.tile .tn,.name,.big,.lvl b{font-weight:400}
.logo{font-size:18px;letter-spacing:.02em}
.hbtn{border-radius:999px;padding:6px 14px;font-size:13px}
.xpbar{border-radius:999px;box-shadow:0 0 0 2px var(--night-3)}
.stage{border-radius:28px;box-shadow:0 0 0 4px var(--night-3),0 10px 0 4px var(--ink)}
.stage::after{left:-15%;right:-15%;bottom:-48%;height:78%;border-radius:50%;box-shadow:inset 0 10px 0 var(--ground-top)}
.moon{border-radius:50%;width:48px;height:48px;box-shadow:0 0 0 8px #FFF4E61f,0 0 50px #FFC15E88}
.moon::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#F6E2C8;top:14px;left:12px;box-shadow:16px 10px 0 -3px #F6E2C8}
.cloud{height:20px;border-radius:999px;background:#FFF4E61f}
.cloud::before{content:"";position:absolute;width:55%;height:190%;left:18%;bottom:20%;border-radius:50%;background:inherit}
.c1{width:84px;top:22%;left:30%;animation:drift 18s ease-in-out infinite}
.c2{width:60px;top:12%;left:62%;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{50%{translate:26px 0}}
.spark{color:var(--honey);font-size:16px;animation:twinkle 2.6s ease-in-out infinite}
.s1{top:20%;left:18%}.s2{top:34%;right:24%;font-size:12px;animation-delay:.8s}.s3{top:9%;left:48%;font-size:10px;color:var(--blush);animation-delay:1.6s}
@keyframes twinkle{50%{opacity:.25;scale:.6}}
.spr{width:clamp(118px,20vw,178px);bottom:9%;filter:drop-shadow(0 4px 0 #0003)}
.spr.center{width:clamp(130px,22vw,190px)}
.spr.dim{filter:brightness(.62) saturate(.75)}
.spr.talk,.spr.right.talk{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{translate:0 -7px}}
.spr.hit{animation:hit .55s ease}
@keyframes hit{0%,100%{translate:0;rotate:0}25%{translate:-12px 0;rotate:-8deg;filter:brightness(1.8)}60%{translate:10px 0;rotate:6deg}}
.eye{transform-box:fill-box;transform-origin:center;animation:blinkEye 4.2s infinite}
@keyframes blinkEye{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.place,.bosshp{border-radius:999px;padding:5px 14px;font-size:12px}
.bosshp span{border-radius:50%;width:16px;height:16px}
.title-card h1{font-size:clamp(32px,6.4vw,58px);line-height:1.05;text-shadow:3px 4px 0 var(--ink),0 0 34px #FF9EC477}
.title-card h1 em{color:var(--blush)}
.title-card .press{font-size:12px}
.box{border-radius:24px;box-shadow:0 0 0 4px var(--parch-2),0 8px 0 4px var(--ink);padding:22px 22px 18px}
.name{border-radius:999px;font-size:13px;padding:4px 14px;top:-17px}
.choice{border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice .k{border-radius:50%;font-size:11px}
.tile{border-radius:18px;box-shadow:0 4px 0 var(--ink);grid-template-columns:56px 1fr}
.tile svg{width:56px;height:56px;border-radius:16px;padding:3px}
.tile .tn{font-size:14px}
.tile .st{border-radius:999px;font-size:11px;padding:3px 10px}
.card{border-radius:26px;box-shadow:0 0 0 4px var(--parch-2),0 10px 0 4px var(--ink)}
.card h2{font-size:22px;line-height:1.25}
.eyebrow,.sec{font-size:11px}
.xbtn{border-radius:50%;font-size:13px}
.get svg{border-radius:20px;padding:6px;width:80px;height:80px}
.get{grid-template-columns:80px 1fr}
.chip{border-radius:999px;font-size:11.5px;padding:3px 10px}
.big{border-radius:999px;box-shadow:0 4px 0 var(--ink);font-size:15px;padding:10px 20px}
.sheet-head svg{border-radius:22px;padding:4px}
.pips i{border-radius:50%}
.slot{border-radius:14px}
.slot svg{width:78%;height:78%}
.toast{border-radius:999px;font-size:15px;box-shadow:0 5px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="hud">
    <div class="logo"><span class="heart">&#9829;</span> NAOWAL'S QUEST</div>
    <div class="lvl" id="lvl"><b id="lvtxt">Lv 1</b><div class="xpbar" role="progressbar" aria-label="Experience" id="xpbar"><i id="xpfill"></i></div></div>
    <div class="hud-btns">
      <button class="hbtn" id="btnMap" type="button">Map</button>
      <button class="hbtn" id="btnParty" type="button">Party &#9733; <span id="itemCount">0/5</span></button>
    </div>
  </header>

  <main id="game">
    <div class="stage bg-home" id="stage"></div>
    <div id="below"></div>
  </main>

  <p class="foot">A playable profile of Naowal Siripatana &middot; Software Engineer &middot; Nakhon Si Thammarat, Thailand &middot; <a href="https://www.linkedin.com/in/naowal-siripatana" target="_blank" rel="noopener">LinkedIn</a></p>
</div>
<div id="overlay"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(function(){
/* ---------- Chibi sprites (inline SVG) ---------- */
const I="#2A1B3D";
const ST='stroke="#2A1B3D" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
const eye=(x,y,r=1)=>`<g class="eye"><ellipse cx="${x}" cy="${y}" rx="${7*r}" ry="${9*r}" fill="${I}"/><circle cx="${x+2.4*r}" cy="${y-3.4*r}" r="${3*r}" fill="#fff"/><circle cx="${x-2.4*r}" cy="${y+3.6*r}" r="${1.5*r}" fill="#fff"/></g>`;
const dot=(x,y)=>`<g class="eye"><circle cx="${x}" cy="${y}" r="4" fill="${I}"/><circle cx="${x+1.4}" cy="${y-1.4}" r="1.4" fill="#fff"/></g>`;
const blush=(x,y,s=1)=>`<ellipse cx="${x}" cy="${y}" rx="${6*s}" ry="${3.5*s}" fill="#FF9EC4" opacity=".85"/>`;
const smile=(x,y,w=5)=>`<path d="M${x-w} ${y} Q${x} ${y+w} ${x+w} ${y}" fill="none" stroke="${I}" stroke-width="3" stroke-linecap="round"/>`;
const shadow=`<ellipse cx="60" cy="134" rx="36" ry="5" fill="#000" opacity=".22"/>`;
const C="0 0 120 140",IT="0 0 100 100";
const svg=(vb,body)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${body}</svg>`;
const SVG={
naowal:svg(C,shadow+
 `<ellipse cx="48" cy="133" rx="9" ry="5" fill="${I}"/><ellipse cx="72" cy="133" rx="9" ry="5" fill="${I}"/>`+
 `<path d="M34 102 C34 92 44 88 60 88 C76 88 86 92 86 102 L88 124 C88 129 84 131 80 131 L40 131 C36 131 32 129 32 124 Z" fill="#FF6B4A" ${ST}/>`+
 `<path d="M18 62 C16 28 38 8 60 8 C82 8 104 28 102 62 C104 80 99 96 92 106 C80 113 40 113 28 106 C21 96 16 80 18 62 Z" fill="#E98CA6" ${ST}/>`+
 `<path d="M34 100 C42 92 50 90 58 92 M86 100 C78 93 70 91 63 93 M24 80 C26 90 30 98 36 103 M96 80 C94 90 90 98 84 103" fill="none" stroke="#C96A88" stroke-width="3" stroke-linecap="round"/>`+
 `<ellipse cx="60" cy="61" rx="34" ry="33" fill="#FBD3DD" ${ST}/>`+

  intro1:{bg:"home",place:"Nakhon Si Thammarat",who:N,right:N,text:"Oh! A traveler! Welcome to *Nakhon Si Thammarat*, the town where my quest began. I'm *Naowal*, a software engineer. I build financial systems by day and, well… sometimes by night too.",

  intro2b:{bg:"home",place:"Nakhon Si Thammarat",who:N,right:N,text:"Fair question! Every line of code is a small quest: a bug to beat, a user to help. A list of job titles never shows who someone really is, so I turned mine into a world you can play.",

  intro2:{bg:"home",place:"Nakhon Si Thammarat",who:N,right:N,text:"There are *five regions* in my story. Visit them in any order. Each one gives you a memory, an item and some XP. Collect *three items* and the Gate opens. Something's been lurking there…",

  a1:{bg:"academy",place:"Songkla Academy · 2010",who:"Professor Hoot",left:"owl",right:N,text:"Hoo-hoo! Welcome to *Prince of Songkla University*. Naowal studied *Computer Science* in these halls from 2010 to 2014.",ch:[{t:"What was Naowal like as a student?",go:"a2"}]},
  a2:{bg:"academy",place:"Songkla Academy · 2014",who:N,left:"owl",right:N,text:"Four years of algorithms, data structures and a lot of instant noodles. I graduated with *Second Class Honors*, and I still think about linked lists more than is healthy.",ch:[{t:"Impressive!",go:"a3"}]},
  a3:{bg:"academy",place:"Songkla Academy",who:"Professor Hoot",left:"owl",right:N,text:"Pop quiz, traveler! Of everything learned here, what has helped Naowal most in the years since?",
    ch:[{t:"The fundamentals. They outlive every framework.",go:"a4ok",fx:{xp:20}},{t:"Memorizing the syntax of every language",go:"a4no"}]},
  a4ok:{bg:"academy",place:"Songkla Academy",who:"Professor Hoot",left:"owl",right:N,text:"Hoo! Correct! Since graduating, Naowal has shipped in *Python, Java, Go, C#, VB.NET, JavaScript and TypeScript*. Only fundamentals make that possible.",ch:[{t:"Receive the reward",go:"GET:scroll",primary:1}]},
  a4no:{bg:"academy",place:"Songkla Academy",who:"Professor Hoot",left:"owl",right:N,text:"Hoo… not quite. Syntax changes every few years. Naowal has worked in *Python, Java, Go, C#, VB.NET and TypeScript*. Fundamentals are what carried across.",ch:[{t:"Receive the reward",go:"GET:scroll",primary:1}]},

  b1:{bg:"forge",place:"The Django Forge · 2019",who:"Bolt the Forge Golem",left:"golem",right:N,text:"CLANG! Welcome to the Forge. Here Naowal hammered out web apps with *Python and Django*, one after another.",ch:[{t:"What was the first thing forged here?",go:"b2"}]},
  b2:{bg:"forge",place:"The Django Forge · 2019–2020",who:N,left:"golem",right:N,text:"At *Cons Robotics* I built two Django sites, including an e-commerce store for IT books. Then at *DomeCloud* I made an internal app for tracking and communicating employee work.",ch:[{t:"And after that?",go:"b3"}]},
  b3:{bg:"forge",place:"The Django Forge · 2020–2022",who:N,left:"golem",right:N,text:"At *Inventus* I analyzed Isuzu's logistics software with Python, Java and SQL. At *PRODIGY9* I built the fitcrew.cc landing page and API, and *WeaselHR* from scratch with Django, DRF, Postgres, Svelte and Tailwind.",ch:[{t:"That's a lot of hammering!",go:"b4"}]},
  b4:{bg:"forge",place:"The Django Forge",who:"Bolt the Forge Golem",left:"golem",right:N,text:"A client needs a brand-new web app by next month. What does Naowal do first?",
    ch:[{t:"Listen to the users, then design the API",go:"b5",fx:{xp:20}},{t:"Start coding the prettiest UI right away",go:"b5b"}]},
  b5:{bg:"forge",place:"The Django Forge",who:N,left:"golem",right:N,text:"Exactly my style! I listen first, then build a solid *REST API* so every screen stands on firm ground. Pretty comes next, and it lasts longer that way.",ch:[{t:"Receive the reward",go:"GET:hammer",primary:1}]},
  b5b:{bg:"forge",place:"The Django Forge",who:N,left:"golem",right:N,text:"Hehe, tempting! But a pretty UI on a shaky base cracks fast. I listen to users first, then build a solid *REST API*, then make it lovely.",ch:[{t:"Receive the reward",go:"GET:hammer",primary:1}]},

  c1:{bg:"tower",place:"Architects' Tower · 2021",who:"Archie the Crow",left:"crow",right:N,text:"Caw! You've climbed the Tower. In 2021 Naowal served at *Buzzfreeze Solution* as *Software Architect and Assistant to the Tech Leader*.",ch:[{t:"What did the job involve?",go:"c2"}]},
  c2:{bg:"tower",place:"Architects' Tower · 2021",who:N,left:"crow",right:N,text:"I designed low-code applications in *OutSystems*, built an *e-permit application for PTT*, and led our engineering team, fully remote, across screens and time zones.",ch:[{t:"Leading remotely sounds hard",go:"c3"}]},
  c3:{bg:"tower",place:"Architects' Tower",who:"Archie the Crow",left:"crow",right:N,text:"Caw! A test for you. The team is stuck on a hard problem and morale is low. What would Naowal do?",
    ch:[{t:"Clear the blocker together and share the credit",go:"c4",fx:{xp:20}},{t:"Stay up all night and fix it alone",go:"c4b"}]},
  c4:{bg:"tower",place:"Architects' Tower",who:N,left:"crow",right:N,text:"Yes! I stay calm, break the problem into small pieces, and make sure everyone gets their win. An easy-going team is a fast team.",ch:[{t:"Receive the reward",go:"GET:compass",primary:1}]},
  c4b:{bg:"tower",place:"Architects' Tower",who:N,left:"crow",right:N,text:"I tried that once… never again! The team learns more when we solve it together, and I get to sleep. Calm, small steps, shared credit.",ch:[{t:"Receive the reward",go:"GET:compass",primary:1}]},

  d1:{bg:"guild",place:"Guild of Teachers · 2017",who:"The Little Learners",left:"sprites",right:N,text:"Hi hi hi! We're the *Little Learners*! Naowal taught us how to code! Well, how to try, fail, and try again.",ch:[{t:"Naowal was a teacher?",go:"d2"}]},
  d2:{bg:"guild",place:"Guild of Teachers · 2017–2019",who:N,left:"sprites",right:N,text:"From 2017 to 2019 I was a *course creator and teaching assistant* for an online pre-code camp, ran the MOOC platform as its admin, and wrote *Go* for a fan-greeting web app's dashboard.",ch:[{t:"Did you keep teaching?",go:"d3"}]},
  d3:{bg:"guild",place:"Guild of Teachers · 2023–2024",who:N,left:"sprites",right:N,text:"Later I joined *FutureSkill* as a *Learning Designer*. I researched tech and data trends and shaped courses in *Big Data, Data Engineering, React and TypeScript*. I also write about Django in Thai.",ch:[{t:"So cool!",go:"d4"}]},
  d4:{bg:"guild",place:"Guild of Teachers",who:"The Little Learners",left:"sprites",right:N,text:"Naowal, Naowal! What's the secret to teaching hard things?",
    ch:[{t:"Make hard things feel friendly",go:"d5",fx:{xp:20}},{t:"Use as much jargon as possible",go:"d5b"}]},
  d5:{bg:"guild",place:"Guild of Teachers",who:N,left:"sprites",right:N,text:"That's it! If a learner feels safe to ask a silly question, they'll learn ten times faster. That's also how I explain tech to clients and teammates.",ch:[{t:"Receive the reward",go:"GET:lantern",primary:1}]},
  d5b:{bg:"guild",place:"Guild of Teachers",who:N,left:"sprites",right:N,text:"Oh no, the Learners are hiding! Jargon scares people away. Make hard things feel friendly, and everyone learns faster, clients included.",ch:[{t:"Receive the reward",go:"GET:lantern",primary:1}]},

  e3:{bg:"citadel",place:"Finance Citadel · now",who:N,left:"cat",right:N,text:"I work with teams at *Asset Plus, LH Fund Management, Krungsri* and *Krungthai Asset Management*, turning their requirements into features, fixing issues, and testing until everything runs smoothly.",ch:[{t:"Sounds serious",go:"e4"}]},
  e4:{bg:"citadel",place:"Finance Citadel",who:"Ledger the Vault Cat",left:"cat",right:N,text:"A fund report is off by *0.01 baht*. Is that close enough?",
    ch:[{t:"No. Find the bug.",go:"e5",fx:{xp:20}},{t:"It's just one satang…",go:"e5b"}]},
  e5:{bg:"citadel",place:"Finance Citadel",who:"Ledger the Vault Cat",left:"cat",right:N,text:"Purrfect. In finance, one satang *is* a bug. Naowal traces it, fixes it, and adds a test so it never comes back.",ch:[{t:"Receive the reward",go:"GET:ledger",primary:1}]},
  e5b:{bg:"citadel",place:"Finance Citadel",who:"Ledger the Vault Cat",left:"cat",right:N,text:"HISSS! In finance, one satang *is* a bug. Naowal would trace it, fix it, and add a test so it never comes back.",ch:[{t:"Receive the reward",go:"GET:ledger",primary:1}]}
};

/* ---------- State ---------- */
const KEY="naowal-quest-v1";
const fresh=()=>({scene:"TITLE",xp:0,items:[],used:[],bossHp:3,lastHit:null});
let S=fresh();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");return v&&v.scene?v:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const lvl=xp=>1+Math.floor(xp/100);
function stats(){const o={};STATS.forEach(([k])=>o[k]=0);S.items.forEach(i=>{const s=ITEMS[i].stats;for(const k in s)o[k]+=s[k]});return o}

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const stage=$("stage"),below=$("below"),overlay=$("overlay");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function fmt(s){return esc(s).replace(/\*(.+?)\*/g,'<span class="hl">$1</span>')}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);$("live").textContent=msg;setTimeout(()=>t.remove(),1800)}
function addXp(n){const before=lvl(S.xp);S.xp+=n;if(lvl(S.xp)>before)setTimeout(()=>toast("LEVEL UP! Lv "+lvl(S.xp)),300)}
function hud(){
  $("lvtxt").textContent="Lv "+lvl(S.xp);
  $("xpfill").style.width=(S.xp%100)+"%";
  $("xpbar").setAttribute("aria-valuenow",S.xp%100);
  $("itemCount").textContent=S.items.length+"/5";
  $("btnMap").hidden=S.scene==="TITLE";
}
function setStage(bg,parts){
  stage.className="stage bg-"+bg;stage.innerHTML='<div class="deco moon"></div><div class="deco cloud c1"></div><div class="deco cloud c2"></div><span class="deco spark s1">&#10022;</span><span class="deco spark s2">&#10022;</span><span class="deco spark s3">&#10022;</span>';
  parts.forEach(p=>stage.appendChild(p));
}
function spr(key,cls){const c=drawSprite(key);c.setAttribute("class","spr "+cls);return c}

let typer=null,typingDone=null;
function typeInto(el,html,done){
  clearInterval(typer);
  if(reduce){el.innerHTML=html;done();return}
  // reveal by characters of plain text while preserving spans
  const tmp=document.createElement("div");tmp.innerHTML=html;
  const total=tmp.textContent.length;let n=0;
  const finish=()=>{clearInterval(typer);typingDone=null;el.innerHTML=html;done()};
  typingDone=finish;
  typer=setInterval(()=>{n+=2;if(n>=total){finish();return}el.innerHTML=cut(html,n)+'<span class="caret">&#9829;</span>'},18);
}
function cut(html,n){let out="",c=0,i=0;while(i<html.length&&c<n){if(html[i]==="<"){const j=html.indexOf(">",i);out+=html.slice(i,j+1);i=j+1}else if(html[i]==="&"){const j=html.indexOf(";",i);out+=html.slice(i,j+1);i=j+1;c++}else{out+=html[i++];c++}}
  const opens=(out.match(/<span/g)||[]).length,closes=(out.match(/<\/span>/g)||[]).length;return out+"</span>".repeat(Math.max(0,opens-closes))}

function dialog(who,isNpc,text,choices){
  below.innerHTML="";
  const box=document.createElement("section");box.className="box";box.setAttribute("aria-live","polite");
  box.innerHTML='<div class="name'+(isNpc?' npc':'')+'">'+esc(who)+'</div><p class="text" id="txt"></p><div class="choices" id="chs" hidden></div>';
  below.appendChild(box);
  const txt=box.querySelector("#txt"),chs=box.querySelector("#chs");
  choices.forEach((c,i)=>{
    const el=document.createElement(c.href?"a":"button");
    el.className="choice"+(c.primary?" primary":"");
    if(c.href){el.href=c.href;el.target="_blank";el.rel="noopener"}else el.type="button";
    el.innerHTML='<span class="k">'+(i+1)+'</span><span>'+esc(c.t)+(c.sub?'<small>'+esc(c.sub)+'</small>':'')+'</span>';
    if(c.on)el.addEventListener("click",c.on);
    chs.appendChild(el);
  });
  txt.addEventListener("click",()=>typingDone&&typingDone());
  typeInto(txt,fmt(text),()=>{chs.hidden=false;const f=chs.querySelector(".choice");if(f&&document.activeElement&&document.activeElement.classList.contains("choice"))f.focus()});
}

/* ---------- Screens ---------- */
function render(){
  const id=S.scene;hud();
  if(id==="TITLE")return title();
  if(id==="MAP")return map();
  if(id==="BATTLE")return battle();
  if(id==="END")return ending();
  const sc=SC[id];if(!sc){S.scene="MAP";return render()}
  const parts=[];
  if(sc.left)parts.push(spr(sc.left,"left"+(sc.who===N?" dim":" talk")));
  if(sc.right)parts.push(spr(sc.right,"right"+(sc.who===N?" talk":(sc.left?" dim":""))));
  const pl=document.createElement("div");pl.className="place";pl.textContent=sc.place;parts.push(pl);
  setStage(sc.bg,parts);
  dialog(sc.who===N?"Naowal":sc.who,sc.who!==N,sc.text,sc.ch.map(c=>({...c,on:()=>choose(c)})));
}
function choose(c){
  if(c.fx&&c.fx.xp)addXp(c.fx.xp);
  if(c.go.startsWith("GET:"))return give(c.go.slice(4));
  go(c.go);
}
function go(id){S.scene=id;save();render();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"})}

function title(){
  const card=document.createElement("div");card.className="title-card";
  card.innerHTML='<h1>NAOWAL\'S<br><em>QUEST</em></h1><p>A playable profile. Adventure through the life and work of software engineer Naowal Siripatana.</p><div class="press">&#9656; PRESS START</div>';
  setStage("home",[card,spr(N,"right talk")]);
  const saved=load();
  const ch=[];
  if(saved&&saved.scene!=="TITLE")ch.push({t:"Continue",sub:"Lv "+lvl(saved.xp)+" · "+saved.items.length+"/5 items",primary:1,on:()=>{S=saved;go(S.scene)}});
  ch.push({t:saved&&saved.scene!=="TITLE"?"New game":"Start adventure",sub:"About 5 minutes",primary:!(saved&&saved.scene!=="TITLE"),on:()=>{S=fresh();go("intro1")}});
  ch.push({t:"Skip to the character sheet",sub:"For busy recruiters",on:()=>sheet()});
  dialog("Narrator",true,"Every hero has a backstory. This one has *five regions*, *five items*, and one very stubborn *Legacy Bug*.",ch);
}

function map(){
  const pl=document.createElement("div");pl.className="place";pl.textContent="World Map";
  setStage("home",[pl,spr(N,"center talk")]);
  below.innerHTML="";
  const box=document.createElement("section");box.className="box";
  const n=S.items.length;
  box.innerHTML='<div class="name">Naowal</div><p class="text" style="cursor:default">'+
    (n===0?"Where to first? Every region is a chapter of my life. Pick any!":n<3?"Nice! "+(3-n)+" more item"+(3-n>1?"s":"")+" and the Gate opens.":n<5?"The Gate is open! Face the bug now, or keep exploring first.":"You've seen my whole story! The Gate awaits.")+
    '</p><div class="map" id="mapgrid"></div>';
  below.appendChild(box);
  const grid=box.querySelector("#mapgrid");
  REGIONS.forEach(r=>{
    const done=S.items.includes(r.item);
    const b=document.createElement("button");b.type="button";b.className="tile"+(done?" done":"");
    b.style.setProperty("--tile-bg",r.tileBg);
    b.appendChild(drawSprite(r.sprite));
    b.insertAdjacentHTML("beforeend",'<span class="tn">'+r.name+'</span><span class="ty">'+r.years+'</span><span class="st">'+(done?"&#9733; CLEARED · replay":"&#9656; EXPLORE")+'</span>');
    b.addEventListener("click",()=>go(r.start));
    grid.appendChild(b);
  });
  const open=n>=3,beaten=S.bossHp<=0;
  const g=document.createElement("button");g.type="button";g.className="tile gate"+(open?"":" locked");
  g.style.setProperty("--tile-bg","#7A2A4A");
  g.appendChild(drawSprite(open?"bug":"gate"));
  g.insertAdjacentHTML("beforeend",'<span class="tn">The Gate</span><span class="ty">Final quest</span><span class="st">'+(beaten?"&#9733; DEFEATED · finale":open?"&#9876; ENTER":"LOCKED · "+n+"/3 items")+'</span>');
  if(open)g.addEventListener("click",()=>{if(beaten)go("END");else{S.bossHp=3;S.used=[];S.lastHit=null;go("BATTLE")}});
  else g.setAttribute("aria-disabled","true");
  grid.appendChild(g);
}

function give(key){
  const it=ITEMS[key],isNew=!S.items.includes(key);
  if(isNew){S.items.push(key);addXp(100)}
  save();hud();
  overlay.innerHTML='<div class="ov" role="dialog" aria-modal="true" aria-labelledby="gt"><div class="card">'+
    '<div class="eyebrow">'+(isNew?"Item get! +100 XP":"Memory revisited")+'</div>'+
    '<div class="get"><div id="gi"></div><div><h2 id="gt">'+it.name+'</h2><p>'+esc(it.desc)+'</p></div></div>'+
    '<div class="bumps">'+Object.entries(it.stats).map(([k,v])=>'<span class="chip mint">'+k+' +'+v+'</span>').join("")+'<span class="chip pink">Trait: '+it.trait+'</span></div>'+
    '<div class="row"><button class="big" id="gok" type="button">Back to the map</button><button class="big alt" id="gsheet" type="button">View party</button></div></div></div>';
  overlay.querySelector("#gi").appendChild(drawSprite(key));
  const close=()=>{overlay.innerHTML="";go("MAP")};
  overlay.querySelector("#gok").onclick=close;
  overlay.querySelector("#gsheet").onclick=()=>{overlay.innerHTML="";S.scene="MAP";save();render();sheet()};
  overlay.querySelector("#gok").focus();
}

function battle(){
  const hp=document.createElement("div");hp.className="bosshp";
  hp.innerHTML="LEGACY BUG "+[0,1,2].map(i=>'<span class="'+(i<S.bossHp?"":"off")+'"></span>').join("");
  const bug=spr("bug","left talk"+(S.lastHit?" hit":""));
  const pl=document.createElement("div");pl.className="place";pl.textContent="The Gate";
  setStage("gate",[pl,hp,bug,spr(N,"right")]);
  if(S.bossHp<=0){
    dialog("Narrator",true,(S.lastHit?ITEMS[S.lastHit].hit+" ":"")+"The *Legacy Bug* crumbles into a harmless pile of semicolons. The Gate swings open…",[{t:"Walk through the Gate",primary:1,on:()=>go("END")}]);
    return;
  }
  const avail=S.items.filter(i=>!S.used.includes(i));
  const intro=S.lastHit?ITEMS[S.lastHit].hit+" It's still wriggling. Use another item!":"A wild *LEGACY BUG* appears! It has been hiding in production since before anyone can remember. Naowal whispers: \"Use what you learned on my journey!\"";
  dialog(S.lastHit?"Narrator":"Legacy Bug",true,intro,avail.map(k=>({t:"Use "+ITEMS[k].name,sub:Object.keys(ITEMS[k].stats).join(" · "),on:()=>{
    S.used.push(k);S.lastHit=k;S.bossHp--;addXp(S.bossHp<=0?60:20);go("BATTLE")}})));
}

function ending(){
  const pl=document.createElement("div");pl.className="place";pl.textContent="Beyond the Gate";
  setStage("home",[pl,spr(N,"center talk")]);
  const ch=[{t:"Recruit Naowal on LinkedIn",sub:"linkedin.com/in/naowal-siripatana",primary:1,href:"https://www.linkedin.com/in/naowal-siripatana"},
    {t:"View character sheet",on:()=>sheet()}];
  if(S.items.length<5)ch.push({t:"Explore the regions you missed",sub:(5-S.items.length)+" left",on:()=>go("MAP")});
  ch.push({t:"Start a new game",on:()=>{S=fresh();go("intro1")}});
  dialog("Naowal",false,"You did it! Thank you for adventuring through my story. If you ever need a teammate who *builds carefully*, *teaches kindly*, and never lets a satang go missing, I'd love to join your party!",ch);
  toast("Naowal wants to join your party!");
}

function sheet(){
  const st=stats();
  overlay.innerHTML='<div class="ov" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="card">'+
    '<button class="xbtn" id="sx" type="button" aria-label="Close">&#10005;</button>'+
    '<div class="sheet-head"><div id="sp"></div><div><div class="eyebrow">Character sheet</div><h2 id="sh">Naowal Siripatana</h2>'+
    '<p><b>Class:</b> Software Engineer · Full-stack adventurer</p><p><b>Level:</b> '+lvl(S.xp)+' &nbsp;·&nbsp; <b>Home base:</b> Nakhon Si Thammarat, Thailand</p>'+
    '<p><b>Current guild:</b> FINSOFT Company Limited (since Dec 2024)</p></div></div>'+
    '<div class="sec">Stats '+(S.items.length<5?'· unlock more by exploring':'')+'</div><div class="stats">'+
    STATS.map(([k,d])=>'<div class="stat"><span>'+k+'<small>'+d+'</small></span><span class="pips">'+[0,1,2,3,4].map(i=>'<i class="'+(i<st[k]+1?"on":"")+'"></i>').join("")+'</span></div>').join("")+'</div>'+
    '<div class="sec">Inventory · '+S.items.length+'/5</div><div class="inv" id="inv"></div>'+
    '<p class="inv-names">'+(S.items.length?S.items.map(i=>ITEMS[i].name).join(" · "):"Play the adventure to collect items.")+'</p>'+
    '<div class="sec">Traits</div><div class="traits"><span class="chip honey">Warm &amp; cheerful</span>'+S.items.map(i=>'<span class="chip pink">'+ITEMS[i].trait+'</span>').join("")+'</div>'+
    '<div class="sec">Full skill list</div><div class="traits">'+"React.js,Python,Django,DRF,JavaScript,TypeScript,Svelte,Java,C#,VB.NET,.NET Core,SQL,PostgreSQL,MS-SQL,Go,REST APIs,Git,Google Cloud,OutSystems".split(",").map(s=>'<span class="chip">'+s+'</span>').join("")+'</div>'+
    '<div class="sec">Recruit</div><div class="row"><a class="big" href="https://www.linkedin.com/in/naowal-siripatana" target="_blank" rel="noopener">LinkedIn</a><a class="big alt" href="https://github.com/naowal-siripatana" target="_blank" rel="noopener">GitHub</a></div>'+
    '</div></div>';
  overlay.querySelector("#sp").appendChild(drawSprite(N));
  const inv=overlay.querySelector("#inv");
  Object.keys(ITEMS).forEach(k=>{const d=document.createElement("div");const has=S.items.includes(k);d.className="slot"+(has?"":" empty");d.title=has?ITEMS[k].name:"Not found yet";if(has)d.appendChild(drawSprite(k));else d.textContent="?";inv.appendChild(d)});
  const close=()=>{overlay.innerHTML=""};
  overlay.querySelector("#sx").onclick=close;
  overlay.querySelector(".ov").addEventListener("click",e=>{if(e.target.classList.contains("ov"))close()});
  overlay.querySelector("#sx").focus();
}

/* ---------- Input ---------- */
$("btnMap").onclick=()=>{overlay.innerHTML="";go("MAP")};
$("btnParty").onclick=()=>sheet();
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&overlay.innerHTML){overlay.innerHTML="";return}
  if(overlay.innerHTML)return;
  if((e.key===" "||e.key==="Enter")&&typingDone&&!(document.activeElement&&document.activeElement.classList.contains("choice"))){e.preventDefault();typingDone();return}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){const chs=document.querySelectorAll("#chs:not([hidden]) .choice");if(chs[n-1]){chs[n-1].click()}}
});

/* ---------- Boot ---------- */
function start(data){
  if(data&&data.scene)S=data;
  render();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>S)}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
})();
</script>
